[project]
name = "ai-architect-test-aurrego-implementation"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.0",
    "httpx==0.27.0",
    "numpy<2.0",
    "pydantic==2.9.0",
    "pymupdf==1.24.0",
    "pytesseract==0.3.10",
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
    "python-levenshtein==0.25.1",
    "python-multipart==0.0.9",
    "qdrant-client==1.11.0",
    "sentence-transformers==3.0.0",
    "spacy==3.7.5",
    "thefuzz==0.22.1",
    "uvicorn==0.30.0",
]

[dependency-groups]
dev = [
    "ruff",
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"